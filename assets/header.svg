<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="M Mahesa — Backend &amp; Network Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.55" stop-color="#0b1326"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#00c2a8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="fiber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c2a8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00c2a8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00c2a8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00c2a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e2a4a" stroke-width="0.6"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .node { fill: #0f1a33; stroke: #00c2a8; stroke-width: 1.5; }
      .node.v { stroke: #a78bfa; }
      .link { fill: none; stroke: #23335c; stroke-width: 1.2; }
      .beam { fill: none; stroke: url(#fiber); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 90 900; animation: beam 4.5s linear infinite; }
      .beam.b2 { animation-delay: -1.5s; animation-duration: 5.5s; }
      .beam.b3 { animation-delay: -3s; animation-duration: 6.5s; }
      .beam.b4 { animation-delay: -0.7s; animation-duration: 5s; }
      @keyframes beam { from { stroke-dashoffset: 990; } to { stroke-dashoffset: 0; } }
      .pulse { transform-origin: center; transform-box: fill-box; animation: pulse 3s ease-in-out infinite; }
      .pulse.p2 { animation-delay: -1s; } .pulse.p3 { animation-delay: -2s; }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.6); } }
      .star { fill: #9fb3d9; animation: twinkle 3.2s ease-in-out infinite; }
      .star.s2 { animation-delay: -1.1s; } .star.s3 { animation-delay: -2.2s; }
      @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
      .name { font: 700 64px "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: -1px; fill: url(#title); filter: url(#textGlow); }
      .role { font: 500 22px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #cbd5e1; letter-spacing: .4px; }
      .mono { font: 500 14px "SFMono-Regular", Menlo, Consolas, monospace; fill: #7c8db5; letter-spacing: 1.5px; }
      .cursor { fill: #00c2a8; animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .rise { animation: rise 1.1s ease-out both; }
      .rise.r2 { animation-delay: .25s; } .rise.r3 { animation-delay: .5s; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .orbit { transform-origin: 940px 180px; animation: spin 40s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)" opacity="0.7"/>
  <circle cx="940" cy="180" r="230" fill="url(#glow)"/>
  <circle cx="220" cy="300" r="180" fill="url(#glowV)"/>

  <!-- stars -->
  <g>
    <circle class="star" cx="80" cy="50" r="1.4"/><circle class="star s2" cx="160" cy="120" r="1"/><circle class="star s3" cx="640" cy="40" r="1.2"/>
    <circle class="star s2" cx="720" cy="300" r="1"/><circle class="star" cx="1120" cy="60" r="1.5"/><circle class="star s3" cx="1160" cy="320" r="1.1"/>
    <circle class="star" cx="420" cy="330" r="1"/><circle class="star s2" cx="560" cy="200" r="0.9"/><circle class="star s3" cx="1040" cy="330" r="1.3"/>
  </g>

  <!-- network constellation (right) -->
  <g class="orbit" opacity="0.9">
    <!-- links -->
    <path class="link" d="M940 180 L1060 110"/><path class="link" d="M940 180 L1080 230"/><path class="link" d="M940 180 L850 90"/>
    <path class="link" d="M940 180 L830 250"/><path class="link" d="M940 180 L990 300"/><path class="link" d="M1060 110 L1130 160"/>
    <path class="link" d="M850 90 L780 140"/><path class="link" d="M830 250 L760 300"/><path class="link" d="M1080 230 L1140 290"/>
    <!-- travelling light -->
    <path class="beam" d="M940 180 L1060 110 L1130 160"/>
    <path class="beam b2" d="M940 180 L850 90 L780 140"/>
    <path class="beam b3" d="M940 180 L830 250 L760 300"/>
    <path class="beam b4" d="M940 180 L1080 230 L1140 290"/>
    <!-- nodes -->
    <circle class="pulse" cx="940" cy="180" r="14" fill="#00c2a8" opacity=".3" filter="url(#soft)"/>
    <circle class="node" cx="940" cy="180" r="9" style="fill:#00c2a8"/>
    <circle class="node" cx="1060" cy="110" r="6"/><circle class="node v" cx="1130" cy="160" r="4"/>
    <circle class="node" cx="850" cy="90" r="6"/><circle class="node v" cx="780" cy="140" r="4"/>
    <circle class="node" cx="830" cy="250" r="6"/><circle class="node v" cx="760" cy="300" r="4"/>
    <circle class="node" cx="1080" cy="230" r="6"/><circle class="node v" cx="1140" cy="290" r="4"/>
    <circle class="node v" cx="990" cy="300" r="5"/>
    <circle class="pulse p2" cx="1060" cy="110" r="10" fill="#00c2a8" opacity=".25" filter="url(#soft)"/>
    <circle class="pulse p3" cx="830" cy="250" r="10" fill="#a78bfa" opacity=".25" filter="url(#soft)"/>
  </g>

  <!-- copy (left) -->
  <g transform="translate(72 0)">
    <text class="mono rise" x="0" y="112">~/mahesa $ whoami<tspan class="cursor"> ▍</tspan></text>
    <text class="name rise r2" x="-3" y="186">M Mahesa</text>
    <text class="role rise r3" x="2" y="226">Backend &amp; Network Engineer</text>
    <!-- outer g keeps the attribute transform; the CSS rise animation lives on the inner g -->
    <g transform="translate(0 258)">
      <g class="rise r3">
        <rect x="0" y="0" width="122" height="26" rx="13" fill="#0f2a2a" stroke="#00c2a8" stroke-opacity=".5"/>
        <text class="mono" x="61" y="17" text-anchor="middle" style="fill:#5eead4;letter-spacing:.5px">Go · Python</text>
        <rect x="134" y="0" width="160" height="26" rx="13" fill="#1a1633" stroke="#a78bfa" stroke-opacity=".5"/>
        <text class="mono" x="214" y="17" text-anchor="middle" style="fill:#c4b5fd;letter-spacing:.5px">Monitoring · NOC</text>
        <rect x="306" y="0" width="166" height="26" rx="13" fill="#0f1a33" stroke="#7c8db5" stroke-opacity=".5"/>
        <text class="mono" x="389" y="17" text-anchor="middle" style="fill:#cbd5e1;letter-spacing:.5px">OLT · PON · SNMP</text>
      </g>
    </g>
  </g>

  <!-- bottom fiber line -->
  <path class="link" d="M0 340 H1200" stroke="#1e2a4a"/>
  <path class="beam b2" d="M0 340 H1200" style="stroke-dasharray:160 1200"/>
</svg>
